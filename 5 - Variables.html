<!DOCTYPE html>         <!--This is a HTML5 document type, ie the latest-->
<html>
  
  <head>
    <title>
      VariablesPractice
    </title>
  </head>
  
  <body>
    <script>
      /*
      This script illustrates how variables are created using the Let keyword
      This creates an INT character
      */

      let Variable1=3;

      /*The below script displays Variable1 in the console*/
      console.log(Variable1);

      /*
      The below creates a STRING variable & displays it in the console
      */

      let Message='Hello World';

      console.log(Message);


    </script>
  </body>

</html>
